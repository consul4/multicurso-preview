<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#f4f6fc"><link rel="icon" href="data:,"><style>:root {

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; grid-template: auto 1fr / var(--rail) minmax(0,1fr); }
[hidden] { display: none !important; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--deep); outline-offset: 3px; }

.top-actions { display: flex; align-items: center; gap: 9px; }

.breadcrumb { display: flex; align-items: center; gap: 7px; min-height: 30px; font-size: 12px; color: var(--muted); margin-bottom: 19px; }
.breadcrumb a { text-decoration: none; }
.breadcrumb .icon { width: 13px; height: 13px; }
.demo { margin-left: auto; flex: none; padding: 5px 8px; background: #e8eef9; border-radius: 20px; color: #344c6c; font-size: 11px; font-weight: 700; }
.heading { margin-bottom: 24px; }
.heading h1 { font-size: clamp(29px,4vw,48px); font-weight: 800; line-height: 1.08; letter-spacing: -.055em; }
.heading p { margin-top: 8px; font-size: clamp(14px,1.25vw,17px); white-space: pre-wrap; }

.dashboard { display: grid; grid-template-columns: minmax(0,2.25fr) minmax(220px,1fr); gap: 18px; align-items: end; }
.course-hero { display: grid; grid-template-columns: minmax(0,1.12fr) minmax(0,1fr); gap: 14px; align-items: center; min-height: 280px; overflow: hidden; padding: clamp(17px,2.5vw,32px); border: 1px solid #d0def7; border-radius: 22px; background: linear-gradient(118deg,#e7efff,#f7f9ff 70%); box-shadow: var(--shadow); }
.course-hero img { display: block; width: 100%; border-radius: 14px; box-shadow: 0 14px 28px #172d7133; }
.hero-copy h2 { font-size: clamp(25px,3.15vw,42px); letter-spacing: -.05em; line-height: 1.08; margin: 10px 0; }
.hero-copy p { margin-bottom: 12px; font-size: 14px; }

.badge { display: inline-flex; border-radius: 20px; padding: 5px 9px; background: #d9e7ff; color: #164395; font-size: 10px; font-weight: 800; letter-spacing: .065em; }
.card { min-width: 0; margin: 0 0 14px; padding: clamp(14px,2vw,23px); border: 1px solid var(--line); border-radius: 17px; background: var(--paper); box-shadow: var(--shadow); }

.summary p { font-size: 14px; }
.stats { margin: 15px 0; }
.stat strong { font-size: 23px; }
.progress-inline { display: grid; grid-template-columns: 1fr minmax(140px,35%); align-items: center; gap: 10px; }
progress { display: block; width: 100%; min-width: 0; height: 8px; appearance: none; border: 0; overflow: hidden; border-radius: 10px; background: #e0e8f9; }
progress::-webkit-progress-bar { background: #e0e8f9; }
progress::-webkit-progress-value { background: var(--blue); border-radius: 10px; }
progress::-moz-progress-bar { background: var(--blue); }
.row { display: flex; align-items: center; gap: 9px; min-height: 63px; padding: 9px 0; }
.row + .row { border-top: 1px solid #e8edf5; }
.row-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row-text strong { font-size: 14px; }
.row-text small { font-size: 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 7px 12px; border: 1px solid transparent; border-radius: 12px; text-decoration: none; font-size: 13px; font-weight: 750; text-align: center; }
.btn .icon { width: 17px; height: 17px; }
.btn.primary { background: var(--blue); color: white; border-color: var(--blue); }
.btn.secondary { background: #fff; color: #203758; border-color: #d4e0f4; }

.btn:disabled { background: #f0f3f8; color: #52627a; border-color: var(--line); }
.actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 12px 0 0; }
label:not(.choice) { display: grid; gap: 6px; margin: 11px 0; font-size: 13px; font-weight: 750; }
input:not([type=radio]),textarea,select { width: 100%; min-height: 43px; padding: 8px 9px; border: 1px solid #aebedb; border-radius: 9px; background: #fbfcff; font-size: 16px; }

.filter { max-width: 400px; }
.form-grid,.admin-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; align-items: start; }
.admin-grid { grid-template-columns: minmax(0,1.65fr) minmax(0,1fr); }
.empty { padding: 17px; margin: 8px 0; border: 1px dashed #b8c9e8; border-radius: 12px; background: #f5f8ff; }
.empty p { margin-top: 4px; }
.feedback { margin: 0 0 13px; padding: 10px 13px; border-radius: 10px; border: 1px solid #c7e6d8; background: #eaf7ee; color: #195638; }
.feedback.error { border-color: #ecd0ce; background: #fff0ef; color: #792b23; }
.workflow { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
.workflow a { min-height: 42px; display: flex; align-items: center; padding: 7px 11px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; background: white; color: #385074; font-size: 13px; }
.workflow a[aria-current] { color: var(--deep); background: #e3eeff; border-color: #bcd1f6; font-weight: 800; }
.preserve,.generated { white-space: pre-wrap; overflow-wrap: anywhere; }

.classroom-controls { margin: 0; }
.class-content,.lesson-next { width: min(100%,925px); margin-inline: auto; }
.video-wrap { background: #0c162b; border-radius: 17px; overflow: hidden; border: 1px solid #cbd8ef; }

.class-content > .actions { margin-bottom: 14px; }
.lesson-next { display: flex; justify-content: space-between; gap: 8px; padding: 12px 0 3px; border-top: 1px solid var(--line); }
.reading img { display: block; width: min(100%,640px); border-radius: 11px; margin-bottom: 12px; }
.reading dl { display: grid; gap: 4px; }
.reading dt { font-weight: 800; margin-top: 5px; }
.reading dd { color: var(--muted); margin: 0; }
.generated:not(:empty) { display: block; margin-top: 12px; padding: 10px; background: var(--wash); border-radius: 9px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0 0 8px; }
legend { font-weight: 800; }
.choice { display: flex; gap: 8px; align-items: start; padding: 8px; min-height: 44px; border-radius: 8px; background: #eef4fe; margin: 6px 0; }
.result,.locked-card { padding: 24px; }
.result h2,.locked-card h2 { margin: 11px 0; }

dialog { width: min(calc(100% - 26px),520px); max-height: calc(var(--visible,100dvh) - var(--st) - var(--sb) - 25px); padding: 0 14px 15px; overflow: auto; overscroll-behavior: contain; border: 1px solid #d4e0f4; border-radius: 18px; background: white; color: var(--ink); }
dialog::backdrop { background: #14265285; }
dialog header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 9px; background: white; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
html[data-keyboard] dialog { position: fixed; top: var(--st); bottom: var(--keyboard-offset,0px); margin-block: auto; }
html:has(dialog[open]) { overflow: hidden; }
.loading { padding: 22px; }
#dock { display: none; }
html[data-standalone] { overflow: hidden; }
html[data-standalone] body { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; grid-template-rows: auto minmax(0,1fr) auto; }
html[data-standalone][data-keyboard] body { height: var(--visible,100vh); height: min(100dvh,var(--visible,100dvh)); }
html[data-standalone] main,html[data-standalone] .rail { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
html[data-standalone] main { scroll-padding-block: 10px 16px; }
html[data-standalone]:not([data-keyboard]) #dock { display: grid; grid-area: 3 / 1 / 4 / -1; grid-template-columns: repeat(5,minmax(44px,1fr)); width: min(calc(100% - max(10px,var(--sl)) - max(10px,var(--sr))),500px); justify-self: center; min-height: 59px; margin-inline-start: max(0px, calc(var(--sl) - max(10px,var(--sr)))); margin-inline-end: max(0px, calc(var(--sr) - max(10px,var(--sl)))); margin-block: 12px calc(9px + var(--sb)); padding: 4px; gap: 2px; border: 1px solid var(--line); border-radius: 30px; background: white; box-shadow: 0 5px 14px #223c7620; }
#dock a,#dock button { display: grid; place-items: center; min-width: 44px; min-height: 44px; padding: 3px; border: 0; border-radius: 22px; background: #edf3ff; color: var(--deep); font-size: 10px; text-decoration: none; }
#dock .icon { width: 19px; height: 19px; }
@media (hover:hover) and (pointer:fine) {
  .quick:hover,.rail a:hover,.icon-btn:hover,.btn:not(:disabled):hover { box-shadow: inset 0 0 0 1px #1049d94b; }
}
@media (prefers-reduced-motion:no-preference) { .btn,.quick { transition: box-shadow 140ms ease-out; } }
@media (max-width:1100px) {
  :root { --rail: 152px; }
  .dashboard { grid-template-columns: minmax(0,1fr); }
  .momentum { min-height: 0; grid-template-columns: 1fr 1fr; align-items: center; }
  .momentum .kicker,.momentum hr { grid-column: 1/-1; }
}
@media (max-width:790px) {
  :root { --rail: 0px; --head: 57px; }
  .rail { display: none; }
  .menu-toggle { display: grid; }
  .top { gap: 5px; padding-inline: max(6px,var(--sl)) max(8px,var(--sr)); }
  .top-actions { gap: 2px; }
  .brand { font-size: 18px; gap: 5px; }
  .logo { width: 29px; height: 34px; }
  .logo .icon { width: 18px; height: 18px; }
  .search-open { margin-left: auto; min-width: 44px; min-height: 44px; justify-content: center; padding: 0; background: transparent; border-color: transparent; }
  .search-open span,.avatar,.notifications { display: none; }

  .quick-grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr; gap: 6px; }
  .summary { flex-wrap: wrap; }
  .summary .btn { margin-left: 0; }

@media (max-width:350px) { .top-actions > .icon-btn[aria-label="Ajuda"] { display: none; } }
.mobile-study { display: none; }
@media (max-width:790px) {
  body[data-class]:not([data-focus]) .top > :not(.mobile-study) { display: none; }
  body[data-class]:not([data-focus]) .mobile-study { display: grid; width: 100%; grid-template-columns: 44px minmax(0,1fr) 44px 44px; align-items: center; gap: 4px; }
  .mobile-study strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; }
  .mobile-study span { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; margin-top: 3px; }

@media (max-width:790px) { .classroom-controls { display: none; } }

/* Shared study chrome */
.focus-study { display: none; }
.area-switch { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.rail-inner { position: sticky; top: calc(var(--head) + var(--st) + 12px); }
.rail { padding: 12px 8px; }

.dashboard { align-items: stretch; }
.momentum { align-self: end; }
.hero-copy p,.result p { max-width: 64ch; }
.btn { min-height: 44px; }

.class-header {
